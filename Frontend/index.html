<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fallback-Metadaten: gelten, solange React die seitenspezifischen Tags aus
         src/components/SEO.jsx noch nicht gesetzt hat (Crawler ohne JS, Social-Bots,
         Ladezeit). Das Attribut markiert sie als Platzhalter: prerender.js entfernt jeden
         so markierten Tag, sobald React einen echten Wert dafür geliefert hat. Ohne die
         Markierung gewinnt der Platzhalter-Titel, weil React 19 seinen Titel VOR dem
         bestehenden in den Kopfbereich hängt. -->
    <title data-default>vnmvalentin — Clash Royale Minigames, Overlays & Stream-Tools</title>
    <meta data-default name="description" content="Clash Royale Multiplayer-Minigames im Browser, OBS-Overlays, Win Tracker und Stream-Tools von vnmvalentin — kostenlos, ohne Installation, direkt in der Lobby spielbar." />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="author" content="vnmvalentin" />
    <meta data-default property="og:site_name" content="vnmvalentin" />
    <meta data-default property="og:locale" content="de_DE" />

    <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/favicons/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Nunito ist die Schrift der Virtual Farm: rund, freundlich, comichaft, aber
         ohne verspielt zu wirken. Vorher lief das ganze HUD auf 'Courier New' —
         eine Schreibmaschinenschrift mit harten Serifen, die zu einem Farmspiel
         nicht passt. Der Rest der Seite bleibt bei Inter/Space Grotesk.
         Fredoka ist die neue Arcade-Schrift der Clash-Royale-Minigames (Hub + Lobby):
         bewusst EINE Schrift für Titel UND Buttons, weil sie über 400–700 hinweg auch
         klein noch gut lesbar bleibt — siehe .cr-arcade-* in src/index.css. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- OBS-Overlays bekommen vom Server dieselbe index.html wie jede andere nicht
         vorgerenderte Adresse — und in der steckt die fertig gerenderte Startseite
         (prerender.js schreibt "/" genau hierhin). Ohne diesen Riegel blitzt beim
         Szenenwechsel in OBS kurz die komplette Startseite auf, bis React die
         Overlay-Route gerendert hat. Zwei Stufen: hier verstecken, unten wegräumen. -->
    <style>html.is-overlay-boot #root { visibility: hidden; }</style>
    <script>
      (function () {
        // Trifft /overlay/credits, /bingo/overlay/…, /twitch-tools/overlay/…,
        // /WinChallengeOverlay/… — aber NICHT die normale Seite /WinChallenge-Overlay.
        if (/(^\/winchallengeoverlay\/)|(\/overlay\/)/i.test(location.pathname)) {
          document.documentElement.classList.add('is-overlay-boot');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Läuft direkt hinter #root und noch vor dem App-Bündel (type=module wird
      // erst nach dem Parsen ausgeführt): wirft die vorgerenderte Startseite raus,
      // bevor sie überhaupt zu sehen ist.
      (function () {
        var el = document.documentElement;
        if (!el.classList.contains('is-overlay-boot')) return;
        var root = document.getElementById('root');
        if (root) root.replaceChildren();
        el.classList.remove('is-overlay-boot');
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
